# Two small services for the end-to-end run: the target (app=my-service) and its dependency (app=orders-db).
# Each pod mounts /data and /etc/config, so the IOChaos experiments have a volume to act on.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-service
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: my-service}
  template:
    metadata:
      labels: {app: my-service}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/config}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
  namespace: shop
spec:
  selector: {app: my-service}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-db}
  template:
    metadata:
      labels: {app: orders-db}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
