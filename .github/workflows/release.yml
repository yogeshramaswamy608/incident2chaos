name: release

# Publishes a release tag: the package to PyPI through trusted publishing, so no token is
# stored anywhere, and the kubectl plugin archive for Krew to the GitHub release of the tag.
# Runs when a GitHub release is published, or by hand for a tag that already has a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow's own tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: release
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('release/pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then echo "tag $TAG does not match version $version"; exit 1; fi
      - name: Build the source archive and the wheel
        run: python -m build --outdir dist release
      - name: Check the package metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Test the wheel with the tests of the tag
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          cd release && python -m pytest -q && incident2chaos coverage
      - name: Build the kubectl plugin archive
        run: python workflow/tools/krew/build_plugin.py --wheel "dist/*.whl" --source release --out plugin
      - name: Record the archive's checksum for the Krew manifest
        run: sha256sum plugin/kubectl-incident2chaos.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: plugin/kubectl-incident2chaos.tar.gz
          if-no-files-found: error

  test-plugin:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
      - name: Run the plugin as kubectl runs it
        run: |
          tar -xzf kubectl-incident2chaos.tar.gz
          python3 --version
          ./kubectl-incident2chaos --help | head -1 | grep "usage: kubectl incident2chaos"
          ./kubectl-incident2chaos --version | grep "incident2chaos ${TAG#v}"
          ./kubectl-incident2chaos faults > /dev/null
          ./kubectl-incident2chaos coverage
          ./kubectl-incident2chaos generate --corpus-id 1 --tool litmus > /dev/null

  pypi:
    needs: [build, test-plugin]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/incident2chaos/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-asset:
    needs: [build, test-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
      - name: Attach the plugin archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" kubectl-incident2chaos.tar.gz --repo "$GITHUB_REPOSITORY"
