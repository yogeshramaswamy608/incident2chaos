name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-24.04, not ubuntu-latest: setup-python has no Python 3.9 for Ubuntu 26.04,
    # which ubuntu-latest began to give this repository on Nov 16, 2026.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest -q
      - run: incident2chaos coverage
